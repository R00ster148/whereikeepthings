<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="#02020a"/>
  <!-- trail -->
  <rect x="6" y="22" width="20" height="20" fill="none" stroke="#00dcff" stroke-opacity="0.18" stroke-width="2"/>
  <rect x="11" y="22" width="20" height="20" fill="none" stroke="#00dcff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- ship: glowing outline with a white core, like the player in game -->
  <rect x="22" y="16" width="32" height="32" fill="none" stroke="#00dcff" stroke-width="4" filter="url(#glow)"/>
  <rect x="28" y="22" width="20" height="20" fill="#fff"/>
</svg>
